<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Westward expansion: changes and consequences</title><desc id="d">Conceptual diagram: federal laws, railroad, and migration lead to different consequences for settlers, Indigenous nations, Chinese workers, and Black migrants.</desc><rect width="900" height="420" fill="#f5f1e8"/><rect x="25" y="30" width="850" height="75" rx="14" fill="#234a68"/><text x="450" y="78" fill="white" font-family="Arial,sans-serif" font-weight="bold" font-size="31" text-anchor="middle">WESTWARD EXPANSION · 1865–1896</text><g stroke="#718b91" stroke-width="5" fill="none"><path d="M160 170H740"/><path d="M160 170V215 M353 170V215 M546 170V215 M740 170V215"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="40" y="215" width="220" height="150" rx="12" fill="#ddebdc" stroke="#4c7952"/><text x="150" y="258" font-size="22" font-weight="bold" fill="#244e34">Settlers</text><text x="150" y="293" font-size="17" fill="#254534">Land and markets</text><text x="150" y="321" font-size="17" fill="#254534">Difficult conditions</text></g><g><rect x="268" y="215" width="185" height="150" rx="12" fill="#f6e3d8" stroke="#995d43"/><text x="360" y="255" font-size="21" font-weight="bold" fill="#713f30">Indigenous</text><text x="360" y="281" font-size="21" font-weight="bold" fill="#713f30">nations</text><text x="360" y="312" font-size="16" fill="#713f30">Land loss</text><text x="360" y="338" font-size="16" fill="#713f30">Assimilation policy</text></g><g><rect x="462" y="215" width="191" height="150" rx="12" fill="#dfe9f9" stroke="#536f99"/><text x="557" y="255" font-size="21" font-weight="bold" fill="#304e7d">Chinese</text><text x="557" y="281" font-size="21" font-weight="bold" fill="#304e7d">workers</text><text x="557" y="312" font-size="16" fill="#304e7d">Railroad labor</text><text x="557" y="338" font-size="16" fill="#304e7d">Discrimination</text></g><g><rect x="661" y="215" width="200" height="150" rx="12" fill="#f1e4f4" stroke="#8a648e"/><text x="761" y="255" font-size="21" font-weight="bold" fill="#69466c">Black</text><text x="761" y="281" font-size="21" font-weight="bold" fill="#69466c">migrants</text><text x="761" y="312" font-size="16" fill="#69466c">New communities</text><text x="761" y="338" font-size="16" fill="#69466c">Continuing racism</text></g></g><text x="450" y="152" fill="#244057" font-family="Arial,sans-serif" text-anchor="middle" font-size="19">Policies, railroads, and migration changed opportunities and control over land</text><text x="450" y="400" fill="#526473" font-family="Arial,sans-serif" text-anchor="middle" font-size="14">Original classroom diagram · Simplified overview, not a historical map</text></svg>